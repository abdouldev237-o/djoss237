{% if form.non_field_errors %}
<div class="mb-5 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700">{{ form.non_field_errors|striptags }}</div>
{% endif %}
<div class="grid gap-5 md:grid-cols-2">
    <label class="block"><span class="mb-2 block text-xs font-black uppercase tracking-[.08em] text-slate-500">Catégorie</span>{{ form.category }}{% for e in form.category.errors %}<small class="mt-1 block text-xs font-semibold text-rose-600">{{ e }}</small>{% endfor %}</label>
    <label class="block"><span class="mb-2 block text-xs font-black uppercase tracking-[.08em] text-slate-500">Ville</span><select id="id_city" name="city" hx-get="{% url 'marketplace:neighborhoods_htmx' %}" hx-trigger="change" hx-target="#id_neighborhood" hx-swap="innerHTML" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm font-semibold outline-none transition focus:border-slate-400 focus:bg-white"><option value="">Choisir une ville</option>{% for value,label in form.fields.city.choices %}{% if value %}<option value="{{ value }}" {% if form.city.value|stringformat:'s' == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}</select>{% for e in form.city.errors %}<small class="mt-1 block text-xs font-semibold text-rose-600">{{ e }}</small>{% endfor %}</label>
    <label class="block"><span class="mb-2 block text-xs font-black uppercase tracking-[.08em] text-slate-500">Quartier</span><select id="id_neighborhood" name="neighborhood" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm font-semibold outline-none transition focus:border-slate-400 focus:bg-white">{% for value,label in form.fields.neighborhood.choices %}<option value="{{ value }}" {% if form.neighborhood.value|stringformat:'s' == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    <label class="block"><span class="mb-2 block text-xs font-black uppercase tracking-[.08em] text-slate-500">État</span>{{ form.condition }}</label>
    <label class="block md:col-span-2"><span class="mb-2 block text-xs font-black uppercase tracking-[.08em] text-slate-500">Titre de l’annonce</span>{{ form.title }}{% for e in form.title.errors %}<small class="mt-1 block text-xs font-semibold text-rose-600">{{ e }}</small>{% endfor %}</label>
    <label class="block"><span class="mb-2 block text-xs font-black uppercase tracking-[.08em] text-slate-500">Prix</span>{{ form.price }}{% for e in form.price.errors %}<small class="mt-1 block text-xs font-semibold text-rose-600">{{ e }}</small>{% endfor %}</label>
    <label class="block"><span class="mb-2 block text-xs font-black uppercase tracking-[.08em] text-slate-500">Type de prix</span>{{ form.price_type }}</label>
    <label class="block md:col-span-2"><span class="mb-2 block text-xs font-black uppercase tracking-[.08em] text-slate-500">Description</span>{{ form.description }}{% for e in form.description.errors %}<small class="mt-1 block text-xs font-semibold text-rose-600">{{ e }}</small>{% endfor %}<div class="mt-1 text-right text-[11px] font-semibold text-slate-400"><span id="descriptionCount">0</span> / 5000</div></label>
    <div class="md:col-span-2"><span class="mb-2 block text-xs font-black uppercase tracking-[.08em] text-slate-500">Photos</span><label class="group flex cursor-pointer flex-col items-center justify-center rounded-3xl border border-dashed border-slate-300 bg-slate-50 px-5 py-9 text-center transition hover:border-slate-400 hover:bg-white"><input id="id_images" name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden"><span class="grid h-14 w-14 place-items-center rounded-2xl bg-white text-slate-700 shadow-sm transition group-hover:-translate-y-1"><i data-lucide="images" class="h-6 w-6"></i></span><strong class="mt-4 text-sm font-black text-slate-900">Ajoutez jusqu’à 10 photos</strong><span class="mt-1 text-xs leading-5 text-slate-500">JPG, PNG ou WEBP · 5 Mo max par image</span></label><div id="imagePreview" class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4 md:grid-cols-5"></div>{% for e in form.images.errors %}<small class="mt-1 block text-xs font-semibold text-rose-600">{{ e }}</small>{% endfor %}</div>
</div>
<input type="hidden" name="website" value="">
