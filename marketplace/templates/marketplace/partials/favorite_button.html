<button
    type="button"
    hx-post="{% url 'marketplace:toggle_favorite' listing.slug %}"
    hx-target="this"
    hx-swap="outerHTML"
    hx-disabled-elt="this"
    class="inline-flex min-h-11 items-center justify-center gap-2 rounded-2xl border px-4 text-sm font-black transition hover:-translate-y-0.5 {% if is_favorite %}border-rose-200 bg-rose-50 text-rose-700{% else %}border-slate-200 bg-white text-slate-700 hover:border-slate-300{% endif %}"
    aria-pressed="{% if is_favorite %}true{% else %}false{% endif %}"
>
    <i data-lucide="{% if is_favorite %}heart{% else %}heart{% endif %}" class="h-4 w-4 {% if is_favorite %}fill-current{% endif %}"></i>
    {% if is_favorite %}Enregistrée{% else %}Enregistrer{% endif %}
</button>
