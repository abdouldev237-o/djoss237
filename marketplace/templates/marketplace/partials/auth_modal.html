<div x-data="authModal()" x-on:open-auth.window="open($event.detail?.mode || 'login', $event.detail?.reason || '')" x-on:auth-success.window="handleSuccess()" x-cloak>
    <div x-show="openState" x-transition.opacity class="fixed inset-0 z-[90] overflow-y-auto overscroll-contain bg-slate-950/50 p-3 backdrop-blur-sm sm:p-4" @keydown.escape.window="close()">
        <div class="flex min-h-full items-center justify-center py-[max(1rem,env(safe-area-inset-top))] sm:py-8" @click.self="close()">
            <div x-show="openState" x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="translate-y-5 scale-[.97] opacity-0" x-transition:enter-end="translate-y-0 scale-100 opacity-100" class="w-full max-w-md max-h-[calc(100dvh-1.5rem)] overflow-hidden rounded-[28px] border border-white/50 bg-white shadow-2xl sm:max-h-[calc(100dvh-4rem)]">
                <div class="relative overflow-hidden bg-slate-950 px-6 py-7 text-white auth-modal-sheen">
                    <div class="absolute -right-16 -top-20 h-48 w-48 animate-[pulse_4s_ease-in-out_infinite] rounded-full bg-amber-400/20 blur-3xl"></div><div class="absolute -left-20 bottom-[-90px] h-44 w-44 animate-[pulse_5s_ease-in-out_infinite] rounded-full bg-sky-400/10 blur-3xl"></div>
                    <div class="relative flex items-start justify-between gap-3">
                        <div>
                            <p class="text-[10px] font-black uppercase tracking-[.18em] text-amber-300">Djoss237</p>
                            <h2 class="mt-2 font-display text-2xl font-black" x-text="mode==='login'?'Bienvenue.':'Créer votre compte.'"></h2>
                            <p class="mt-2 text-sm leading-6 text-slate-300" x-text="mode==='login'?'Connectez-vous pour publier, gérer vos annonces et partager votre profil.':'Votre compte utilise simplement un nom d’utilisateur, un téléphone et un mot de passe.'"></p>
                        </div>
                        <button @click="close()" type="button" class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-white/10 text-white hover:bg-white/15"><i data-lucide="x" class="h-5 w-5"></i></button>
                    </div>
                </div>
                <div class="auth-modal-sheen-scroll auth-scroll-lock max-h-[calc(100dvh-13rem)] overflow-y-auto p-5 sm:p-6">
                    <div class="mb-5 grid grid-cols-2 rounded-2xl bg-slate-100 p-1">
                        <button type="button" @click="switchMode('login')" :class="mode==='login'?'bg-white text-slate-950 shadow-sm':'text-slate-500'" class="rounded-xl px-3 py-2.5 text-sm font-black">Connexion</button>
                        <button type="button" @click="switchMode('signup')" :class="mode==='signup'?'bg-white text-slate-950 shadow-sm':'text-slate-500'" class="rounded-xl px-3 py-2.5 text-sm font-black">Inscription</button>
                    </div>
                    <div id="authModalBody">{% include 'marketplace/partials/auth_login.html' %}</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function authModal(){
    return {
        openState:false,
        mode:'login',
        reason:'',
        open(mode='login',reason=''){this.mode=mode;this.reason=reason;document.body.dataset.authReason=reason||'';this.openState=true;document.body.classList.add('modal-open');this.load(mode);},
        close(){this.openState=false;document.body.classList.remove('modal-open');},
        switchMode(mode){this.mode=mode;this.load(mode);},
        handleSuccess(){
            this.close();
        },
        load(mode){
            const target=document.getElementById('authModalBody'); if(!target || !window.htmx)return;
            const url=mode==='signup'?'{% url "marketplace:signup_form_page" %}':'{% url "marketplace:login_form_page" %}';
            target.setAttribute('aria-busy','true');
            htmx.ajax('GET',url,{target:'#authModalBody',swap:'innerHTML'}).finally(()=>{target.removeAttribute('aria-busy');});
        }
    }
}
</script>
